name: Build

on:
  push:
    tags: [ "v*" ]
    branches: [ "main" ]

jobs:
  # Build validation: runs on main branch pushes and version tags.
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x

    - name: Build Project
      run: |
        dotnet restore
        dotnet build --configuration Release --no-restore

    - name: Run Tests
      run: |
        dotnet test Blasphemous.NewbieEltonLibs.Tests/Blasphemous.NewbieEltonLibs.Tests.csproj --configuration Release --no-restore

  # Release: only runs for version tags (v*). Creates a GitHub release
  # with the DLL and pushes the nupkg to nuget.org.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x

    - name: Build Project
      run: |
        dotnet restore
        dotnet build --configuration Release --no-restore

    - name: Export Settings
      run: |
        VERSION=$(grep -oP '<Version>\K[^<]+' ${{ github.event.repository.name }}/${{ github.event.repository.name }}.csproj)
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create "$GITHUB_REF_NAME" "publish/${{ github.event.repository.name }}.dll#${{ github.event.repository.name }}.dll" --title "v$VERSION" --draft

    - name: Login to NuGet.org
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USERNAME }}

    - name: Upload Nuget
      continue-on-error: true
      run: |
        for nupkg in $(find . -name "*.nupkg" -not -path "*/obj/*"); do
          dotnet nuget push "$nupkg" -k "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json
        done
